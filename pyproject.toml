[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5.0",
    "ldstats",
    "resgo",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "plotly>=6.0.1",
    "quarto>=0.1.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "shiny>=1.6.1",
    "shinylive>=0.8.7",
    "yfinance>=0.2.61",
]

[tool.uv.sources]
ldstats = { path = "../ldstats", editable = true }
resgo = { path = "../resgo/backend/", editable = true}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."
